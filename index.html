<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Maç İzle</title>
    <!-- HLS.js Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 15px;
            padding-bottom: 80px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .header h1 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .match-list {
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .match-card:active {
            transform: scale(0.98);
        }

        .match-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
        }

        .match-time {
            color: var(--primary);
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .match-time .live-indicator {
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .match-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text);
            margin-bottom: 12px;
        }

        .watch-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Video Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 10px;
        }

        .close-btn {
            background: var(--danger);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #000;
            position: relative;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            aspect-ratio: 16/9;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .error-message {
            color: var(--danger);
            text-align: center;
            padding: 20px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CANLI YAYINLAR</h1>
        <div class="status-badge" id="status-text">Bağlanıyor...</div>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Maçlar yükleniyor, lütfen bekleyin...</p>
    </div>

    <div class="match-list" id="matchList"></div>

    <!-- Video Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Yayın Yükleniyor...</div>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <div class="video-container" id="videoContainer">
            <div id="videoLoading" class="loading">
                <div class="spinner"></div>
                <p>Yayın bağlantısı hazırlanıyor...</p>
            </div>
            <!-- Video veya Iframe buraya eklenecek -->
        </div>
    </div>

    <script>
        // API adresi olarak sayfanın çalıştığı mevcut adresi otomatik alır
        const API_URL = window.location.origin;
        let currentHls = null;

        // Maç Listesini Çek
        async function fetchMatches() {
            try {
                // Sona ?api=1 ekleyerek index.js'in JSON verisi dönmesini sağlıyoruz
                const response = await fetch(`${API_URL}/?api=1`);
                if (!response.ok) throw new Error(`HTTP Hata: ${response.status}`);
                
                const data = await response.json();
                
                if (data.basarili && data.maclar.length > 0) {
                    document.getElementById('status-text').textContent = `${data.toplam} Maç Bulundu`;
                    renderMatches(data.maclar);
                } else {
                    showError("Şu an canlı maç bulunmuyor veya sisteme erişilemedi.");
                }
            } catch (error) {
                console.error("Fetch hatası:", error);
                showError("Sunucuya bağlanılamadı. Uygulamayı yeniden başlatın.");
            }
        }

        // Maçları Ekrana Bas
        function renderMatches(maclar) {
            const list = document.getElementById('matchList');
            document.getElementById('loading').style.display = 'none';
            list.innerHTML = '';

            maclar.forEach(mac => {
                const card = document.createElement('div');
                card.className = 'match-card';
                
                const isLive = mac.time.toUpperCase() === 'CANLI';
                
                card.innerHTML = `
                    <div class="match-time">
                        ${isLive ? '<span class="live-indicator"></span> CANLI' : '🕒 ' + mac.time}
                    </div>
                    <div class="match-title">${mac.title}</div>
                    <button class="watch-btn">
                        ▶ Hızlı İzle
                    </button>
                `;

                card.onclick = () => openStream(mac.pageUrl, mac.title);
                list.appendChild(card);
            });
        }

        // Yayın Bağlantısını Çek ve Oynat
        async function openStream(url, title) {
            const modal = document.getElementById('videoModal');
            const container = document.getElementById('videoContainer');
            const titleEl = document.getElementById('modalTitle');
            const loading = document.getElementById('videoLoading');
            
            modal.classList.add('active');
            titleEl.textContent = title;
            
            // Temizlik
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }
            container.querySelectorAll('video, iframe, .error-message').forEach(el => el.remove());
            loading.style.display = 'block';

            try {
                // Yayını çeken istek (Yine kendi sunucumuza)
                const response = await fetch(`${API_URL}/?getStream=true&url=${encodeURIComponent(url)}`);
                const data = await response.json();

                loading.style.display = 'none';

                if (data.basarili) {
                    if (data.type === 'm3u8' && data.proxyStreamUrl) {
                        playM3U8(`${API_URL}${data.proxyStreamUrl}`);
                    } else if (data.type === 'iframe') {
                        playIframe(data.streamUrl);
                    } else {
                        showVideoError("Desteklenmeyen yayın formatı.");
                    }
                } else {
                    showVideoError(data.message || "Yayın adresi bulunamadı.");
                }
            } catch (error) {
                loading.style.display = 'none';
                showVideoError("Yayın çekilirken hata oluştu.");
            }
        }

        // M3U8 Oynatıcı (HLS.js)
        function playM3U8(streamUrl) {
            const container = document.getElementById('videoContainer');
            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.setAttribute('playsinline', '');
            container.appendChild(video);

            if (Hls.isSupported()) {
                currentHls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                currentHls.loadSource(streamUrl);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        console.error('HLS Hatası:', data);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // iOS cihazlar için doğal destek
                video.src = streamUrl;
            }
        }

        // Iframe Oynatıcı
        function playIframe(url) {
            const container = document.getElementById('videoContainer');
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.setAttribute('scrolling', 'no');
            container.appendChild(iframe);
        }

        function showVideoError(msg) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = `<div class="error-message">${msg}</div>`;
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('matchList').innerHTML = `<div class="error-message">${msg}</div>`;
            document.getElementById('status-text').textContent = 'Hata';
        }

        function closeModal() {
            document.getElementById('videoModal').classList.remove('active');
            const container = document.getElementById('videoContainer');
            
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }
            
            container.querySelectorAll('video, iframe').forEach(el => {
                if (el.tagName === 'VIDEO') {
                    el.pause();
                    el.removeAttribute('src');
                    el.load();
                }
                el.remove();
            });
        }

        // Uygulama başlarken listeyi yükle
        window.onload = fetchMatches;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER TV</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: #121218;
            --card-border: #222230;
            --primary-red: #d32f2f;
            --glow-red: #ff1744;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
        }

        .header {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--glow-red);
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 23, 68, 0.4);
        }

        #player-wrapper {
            display: none;
            width: 100%;
            height: 230px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--primary-red);
            box-shadow: 0 0 15px rgba(211, 47, 47, 0.3);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-play {
            background: linear-gradient(135deg, var(--primary-red), #8b0000);
            color: #fff;
            border: none;
            padding: 8px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-play:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="header">AETHER TV</div>

    <div id="player-wrapper">
        <iframe id="mainIframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <div class="grid" id="channelGrid"></div>

    <script>
        // Vercel Serverless Function Proxy Adresimiz
        const PROXY_URL = "/api/proxy?url=";

        const KANALLAR = [
            { name: "NOW TV", target: "https://izle.livetvuk.com/now-tv/" },
            { name: "TRT 1", target: "https://izle.livetvuk.com/trt-1/" },
            { name: "ATV", target: "https://izle.livetvuk.com/atv/" },
            { name: "Kanal D", target: "https://izle.livetvuk.com/kanal-d/" },
            { name: "Show TV", target: "https://izle.livetvuk.com/show-tv/" },
            { name: "TV8", target: "https://izle.livetvuk.com/tv8/" },
            { name: "Star TV", target: "https://izle.livetvuk.com/star-tv/" },
            { name: "TRT Spor", target: "https://izle.livetvuk.com/trt-spor/" }
        ];

        function kanallariYukle() {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';

            KANALLAR.forEach(kanal => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-title">${kanal.name}</div>
                        <button class="btn-play" onclick="yayiniAc('${kanal.target}')">İZLE</button>
                    </div>
                `;
            });
        }

        function yayiniAc(targetUrl) {
            const wrapper = document.getElementById('player-wrapper');
            const iframe = document.getElementById('mainIframe');

            // İsteği Vercel Serverless proxy katmanı üzerinden yönlendiriyoruz
            iframe.src = PROXY_URL + encodeURIComponent(targetUrl);
            wrapper.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', kanallariYukle);
    </script>
</body>
</html>
